name: Build macOS Intel executable

on: [push]

jobs:
  build:
    runs-on: macos-14   # Stable Apple Silicon runner

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   # Speeds up checkout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          arch -x86_64 pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          arch -x86_64 pyinstaller \
            --windowed \
            --onedir \
            --name main \
            --add-data "config.json:." \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntelApp
          path: dist/main.app
